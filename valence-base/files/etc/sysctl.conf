kernel.printk = 3 4 1 3
kernel.sysrq = 1
# TIOCSTI lets a program put characters into its terminal's input, as if they had been typed. Off, as most
# distributions have it: while it is on, shadow's su gives the shell no terminal when root runs `su - user`
# (no job control there, and doas and sudo refuse to ask for a password).
dev.tty.legacy_tiocsti = 0
vm.swappiness = 30
net.ipv4.tcp_congestion_control = cubic
