# Valence's Calamares: welcome -> disks -> you -> summary -> install.
# Valence is US English / UTC by default, so there are no locale or keyboard pages; Plasma's settings
# change both after the install.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: finish
  module: shellprocess
  config: shellprocess-finish.conf

sequence:
- show:
  - welcome
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfsc
  - users
  - shellprocess@finish
  - umount
- show:
  - finished

branding: valence
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
