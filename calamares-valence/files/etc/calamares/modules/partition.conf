# Layout on an erased disk:
#   UEFI: EFI system partition (/boot/efi, FAT32) + /boot (FAT32, 1 GiB) + / (Btrfs)
#   BIOS: MBR with /boot (FAT32, 1 GiB, bootable) + / (Btrfs)
# The root is Btrfs in the console installer's layout, so that the installed system has snapshots (mount.conf and
# cal-finish make the subvolumes). Manual partitioning can still put / on something else: that system has none.
# /boot stays unencrypted (noEncrypt below), so "Encrypt system" (LUKS) works on both: the kernel and the small
# unlock initramfs live there, and GRUB reads them without a passphrase. Without noEncrypt Calamares encrypts
# every partition of the layout, GRUB cannot be installed, and the disk does not boot. Swap is a swap file plus
# zram, made by the finishing job.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 64MiB
    label: "EFI"
userSwapChoices: [ none ]
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
# no preselected choice: next to Windows, "Install alongside" (shrink) and "Erase disk" are one click apart
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
partitionLayout:
    - name: "valenceboot"
      filesystem: "fat32"
      mountPoint: "/boot"
      noEncrypt: true
      size: 1GiB
    - name: "valence"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
      minSize: 12GiB
