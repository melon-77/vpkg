---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
# A Btrfs root gets Valence's layout (AGENTS.md, "Snapshots and rollback"): the system is the subvolume @, and /home
# and /var/log have their own, so that a rollback leaves both alone. cal-finish makes the other two, @snapshots and
# @swap; /.snapshots stays unmounted while the system is put together (apk's snapshot hook then does nothing).
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: btrfs
      options: [ noatime, "compress=zstd:1" ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: vfat
      options: [ defaults, umask=0077 ]
