# valence-lxqt: the login screen runs on labwc instead of KWin (the 32-bit edition has no Plasma).
# The greeter is a normal window there that labwc shows full screen (/usr/share/valence/sddm-labwc/rc.xml): as a
# layer-shell surface (10-valence.conf, for KWin) labwc drew it as a tiny box on a black screen.
# valence-desktop's 10-valence.conf keeps the rest (Wayland greeter, Valence theme).
[General]
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=xdg-shell

[Wayland]
CompositorCommand=labwc -C /usr/share/valence/sddm-labwc
